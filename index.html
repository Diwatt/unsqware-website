<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!-- Logo « unsqware JAZZ. PROG. » noir sur fond blanc : lisible sur les onglets clairs comme sombres. -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15191c" />
    <!-- Le site est déjà sombre : empêche le mode sombre forcé (Samsung Internet) de foncer l'ocre en rouge. -->
    <meta name="color-scheme" content="dark" />
    <!-- Vérification Bing Webmaster Tools : ne pas retirer, même après validation. -->
    <meta name="msvalidate.01" content="DD71F8B53F2158596F23404E500A1D4C" />
    <meta
      name="description"
      content="UNSQWARE, quartet jazz prog de Nantes : jazz moderne, rock et musique progressive. Totem Live Session, premier EP début 2027, dates de concerts et contact."
    />
    <title>UNSQWARE - Jazz Prog</title>

    <!-- SEO : URL canonique (les autres domaines — unsqware.com, unsqware.fr — doivent rediriger en 301 vers celui-ci).
         La page EN (contenu et métadonnées) est générée au build par scripts/prerender.tsx. -->
    <link rel="canonical" href="https://unsqwa.re/" />
    <link rel="alternate" hreflang="fr" href="https://unsqwa.re/" />
    <link rel="alternate" hreflang="en" href="https://unsqwa.re/en/" />
    <link rel="alternate" hreflang="x-default" href="https://unsqwa.re/" />

    <!-- Partage : Open Graph (Facebook, WhatsApp, LinkedIn, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UNSQWARE" />
    <meta property="og:url" content="https://unsqwa.re/" />
    <meta property="og:title" content="UNSQWARE - Jazz Prog" />
    <meta
      property="og:description"
      content="À la croisée du jazz moderne, du rock et de la musique progressive : le quartet nantais UNSQWARE. Totem Live Session, concerts et premier EP début 2027."
    />
    <meta property="og:image" content="https://unsqwa.re/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Les quatre musiciens d'UNSQWARE sur un quai de Nantes, devant une grue" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Partage : Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UNSQWARE - Jazz Prog" />
    <meta
      name="twitter:description"
      content="À la croisée du jazz moderne, du rock et de la musique progressive : le quartet nantais UNSQWARE. Totem Live Session, concerts et premier EP début 2027."
    />
    <meta name="twitter:image" content="https://unsqwa.re/images/og-image.jpg" />

    <!-- Données structurées « site web » : le domaine unsqwa.re n'écrit pas le nom en entier,
         ce bloc indique à Google d'afficher « UNSQWARE » comme nom du site dans les résultats. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://unsqwa.re/#website",
        "name": "UNSQWARE",
        "alternateName": ["Unsqware", "UNSQ WARE", "unsqwa.re"],
        "url": "https://unsqwa.re/",
        "inLanguage": ["fr", "en"],
        "publisher": { "@id": "https://unsqwa.re/#band" }
      }
    </script>

    <!-- Données structurées : aide Google à relier le nom, les membres et les plateformes du groupe -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "@id": "https://unsqwa.re/#band",
        "name": "UNSQWARE",
        "alternateName": ["Unsqware", "UNSQ WARE"],
        "logo": "https://unsqwa.re/android-chrome-512x512.png",
        "description": "À la croisée du jazz moderne, du rock et de la musique progressive, UNSQWARE façonne un univers instrumental singulier mêlant textures électriques, grooves organiques et envolées improvisées. Formé à Nantes en 2022, le quartet s'inscrit dans la lignée d'Aaron Parks, Snarky Puppy, The Cinematic Orchestra ou Avishai Cohen.",
        "url": "https://unsqwa.re/",
        "image": "https://unsqwa.re/images/hero-groupe-mur-raye.jpg",
        "genre": ["Jazz prog", "Jazz hybride", "Jazz moderne", "Jazz progressif"],
        "foundingDate": "2022",
        "foundingLocation": { "@type": "Place", "name": "Nantes, France" },
        "member": [
          { "@type": "Person", "name": "Florian Roy", "jobTitle": "Basse, contrebasse, compositions" },
          { "@type": "Person", "name": "Charles Demay", "jobTitle": "Batterie" },
          { "@type": "Person", "name": "Fabien Maurin", "jobTitle": "Guitare" },
          { "@type": "Person", "name": "Victor Pavel", "jobTitle": "Piano, claviers" }
        ],
        "sameAs": [
          "https://www.youtube.com/@unsqware",
          "https://www.instagram.com/unsqware",
          "https://www.facebook.com/unsqwaremusique",
          "https://soundcloud.com/unsqware-musique",
          "https://open.spotify.com/artist/1gAWrCVQilgg6uzjN1CmMw",
          "https://linktr.ee/unsqware"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "booking",
          "email": "unsqwaremusique@gmail.com"
        }
      }
    </script>
  </head>
  <body>
    <!-- Contenu statique injecté au build par scripts/prerender.tsx (FR ici, EN dans /en/).
         En dev, la page est vide jusqu'au montage React — c'est normal. -->
    <div id="root"><!--APP_HTML--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
